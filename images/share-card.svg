<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#171B22"/>
      <stop offset="62%" stop-color="#0E1014"/>
    </linearGradient>
    <radialGradient id="brassGlow" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steelGlow" cx="0.12" cy="0.92" r="0.60">
      <stop offset="0%" stop-color="#0F3460" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0F3460" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(115)">
      <rect width="11" height="11" fill="none"/>
      <rect width="2" height="11" fill="#FFFFFF" opacity="0.022"/>
    </pattern>
  </defs>

  <!-- Background: same layered treatment as the site hero -->
  <rect width="1200" height="630" fill="url(#base)"/>
  <rect width="1200" height="630" fill="url(#brassGlow)"/>
  <rect width="1200" height="630" fill="url(#steelGlow)"/>
  <!-- Hatch omitted deliberately: per-pixel noise defeats PNG compression and is
       invisible at the size these cards actually render in a message preview. -->
  <rect width="1200" height="630" fill="url(#hatch)" opacity="0"/>

  <!-- Brass rule down the left edge, echoing the hero's badge border -->
  <rect x="0" y="0" width="10" height="630" fill="#C9A227"/>

  <!-- Eyebrow -->
  <text x="92" y="150" fill="#8B94A2" font-size="23" font-weight="700" letter-spacing="6.4">
    THOMPSONTOWN, PENNSYLVANIA
  </text>

  <!-- Wordmark -->
  <text x="88" y="272" fill="#E6E8EC" font-size="112" font-weight="800" letter-spacing="-3.4">DIMMSVILLE</text>
  <text x="88" y="382" fill="#C9A227" font-size="112" font-weight="800" letter-spacing="-3.4">ARMORY</text>

  <!-- Divider -->
  <rect x="92" y="432" width="128" height="4" fill="#C9A227"/>

  <!-- Services -->
  <text x="92" y="497" fill="#E6E8EC" font-size="31" font-weight="700" letter-spacing="0.4">
    FFL Transfers · Gunsmithing · NFA / Class III
  </text>

  <!-- Contact -->
  <text x="92" y="551" fill="#8B94A2" font-size="27" font-weight="500" letter-spacing="0.3">
    Licensed Type 07 Manufacturer · (717) 953-6359
  </text>

  <!-- Shield + reticle, top right — matches the favicon.
       A plain cross inside a shield reads as a medical mark; the broken-ring
       reticle reads as optics, which is what a Type 07 actually does. -->
  <g transform="translate(946, 118) scale(6.1)" opacity="0.92">
    <path d="M16 4l10 4v8c0 6-4 10-10 12C10 26 6 22 6 16V8z" fill="none" stroke="#C9A227" stroke-width="1.7"/>
    <circle cx="16" cy="16" r="5.1" fill="none" stroke="#C9A227" stroke-width="1.4" stroke-dasharray="3.1 2.3"/>
    <path d="M16 8.6v4.2M16 19.2v4.2M8.6 16h4.2M19.2 16h4.2" stroke="#C9A227" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="1.15" fill="#C9A227"/>
  </g>
</svg>
